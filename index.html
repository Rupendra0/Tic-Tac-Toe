<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic-Tac-Toe Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="msg-container" id="msg-container">
    <p id="msg">Winner</p>
    <button id="new-btn" class="btn">New Game</button>
  </div>

  <main>
    <h1>Tic Tac Toe</h1>
    <div class="intro">
      <h3>Made by: Rupendra Gangwar</h3>
      <p>Only for fun purposes</p>
    </div>

    <div class="container">
      <div class="game" role="grid" aria-label="Tic Tac Toe Board">
        <button class="box btn" aria-label="Cell 1"></button>
        <button class="box btn" aria-label="Cell 2"></button>
        <button class="box btn" aria-label="Cell 3"></button>
        <button class="box btn" aria-label="Cell 4"></button>
        <button class="box btn" aria-label="Cell 5"></button>
        <button class="box btn" aria-label="Cell 6"></button>
        <button class="box btn" aria-label="Cell 7"></button>
        <button class="box btn" aria-label="Cell 8"></button>
        <button class="box btn" aria-label="Cell 9"></button>
      </div>
    </div>

    <button id="reset-btn" class="btn">Reset Game</button>
  </main>

  <script src="app.js"></script>
</body>
</html>
